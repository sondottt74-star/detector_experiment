# 光度增强实验，零样本。训练不含哈尔滨清爽、嘉士伯、科罗娜啤酒，测试只含这三款。
seed: 42
image_size: 518
batch_size: 16
learning_rate: 0.0001
epochs: 20
device: cuda:0
dino_repo: ../models/dinov2_vits14
dino_weights: null
augment: true
train_manifest: cleaned_data/zeroshot/train.jsonl
val_manifest: cleaned_data/zeroshot/val.jsonl
save_dir: save/photometric/zeroshot
log_dir: log/photometric/zeroshot
output_dir: output/photometric/zeroshot/val
infer_manifest: cleaned_data/zeroshot/test.jsonl
checkpoint: save/photometric/zeroshot/best.pt
infer_output: output/photometric/zeroshot/test
